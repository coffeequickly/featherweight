<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<!-- 아이콘은 feather-source.png 를 그대로 자른다. feather.png(투명본)를 쓰면 어두운 면이
     깎여서 128px 에서 힘이 빠진다 — 배경까지 포함한 원본이 더 진하다.
     크롭: 원본 1254 안에서 (151,118) 부터 1065x1065. -->
<div style="width:128px;height:128px;overflow:hidden">
  <div style="width:1065px;height:1065px;overflow:hidden;transform:scale(0.12019);transform-origin:top left">
    <img src="feather-source.png" style="position:relative;left:-151px;top:-118px;width:1254px;height:1254px">
  </div>
</div></body></html>
