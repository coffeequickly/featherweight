<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css"></head><body>
<div style="width:1920px;height:960px;background:var(--bg);padding:78px 176px;display:flex;align-items:center;gap:70px;overflow:hidden;position:relative">
<img src="feather.png" style="position:absolute;right:-260px;bottom:-200px;width:900px;opacity:0.1;transform:rotate(12deg);pointer-events:none">
<div style="position:relative;flex:1 1 auto;max-width:960px;height:599px;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:16px"><img src="feather.png" style="width:42px;flex:0 0 auto"><div style="font-size:29px;font-weight:700;letter-spacing:-.02em;color:var(--fg)">Featherweight</div></div>
  <div style="margin-top:88px">
    <div class="warm" style="display:inline-block;font-size:18px;font-weight:800;letter-spacing:.18em;margin-bottom:22px">REAL FONTS</div>
    <div style="font-size:76px;font-weight:800;line-height:1.1;letter-spacing:-.03em;color:var(--fg)">Real fonts,<br>not outlines.</div>
    <div style="width:76px;height:6px;background:linear-gradient(90deg,var(--gold),var(--magenta));border-radius:3px;margin:30px 0 28px"></div>
    <div style="font-size:27px;line-height:1.55;color:var(--fg-2);max-width:860px">Text is embedded as real subset fonts — selectable, searchable, ATS-readable. 60 open families download automatically; for the rest, point it at your font folder once. Nothing is ever swapped.</div>
  </div>
</div>
<div style="position:relative;flex:0 0 auto;width:470px;height:599px;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6);background:#2c2c2c">
  <img src="ui-fonts.png" style="width:470px;display:block">
</div>
</div></body></html>
